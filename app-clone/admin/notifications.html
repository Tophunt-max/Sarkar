<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications — Gov. Job Alerts Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <script src="assets/js/api.js"></script>
  <script>
    (async function () {
      const { api, toast, confirmDialog, escapeHtml, fmtDate, shell } = window.SarkarAdmin;
      const page = await shell('notifications', 'Notifications', 'Banner messages shown inside the app');

      page.innerHTML = `
        <div class="toolbar">
          <div style="flex:1"></div>
          <button class="btn" id="addBtn">+ New notification</button>
        </div>
        <div class="card">
          <div class="card-head"><h3>All notifications</h3><span class="muted" id="count"></span></div>
          <div class="table-wrap" id="zone"></div>
        </div>

        <div class="modal-backdrop" id="modal">
          <div class="modal">
            <div class="modal-head">
              <h3 id="modalTitle">New notification</h3>
              <button class="modal-x" data-close>&times;</button>
            </div>
            <div class="modal-body">
              <div class="form-grid">
                <div class="form-group full">
                  <label for="n_main">Main title</label>
                  <input type="text" id="n_main" maxlength="180" placeholder="e.g. SSC CGL 2024 notification released" />
                </div>
                <div class="form-group full">
                  <label for="n_sub">Second title / description</label>
                  <input type="text" id="n_sub" maxlength="255" placeholder="e.g. Apply online before 24 July 2024" />
                </div>
                <div class="form-group">
                  <label for="n_date">Publish date</label>
                  <input type="date" id="n_date" />
                </div>
              </div>
              <div class="hint">Push payload preview (FCM data message):</div>
              <pre class="code" id="pushPreview">{}</pre>
              <button class="btn ghost sm copy-btn" id="copyBtn">Copy FCM payload</button>
            </div>
            <div class="modal-foot">
              <button class="btn ghost" data-close>Cancel</button>
              <button class="btn" id="saveBtn">Save</button>
            </div>
          </div>
        </div>`;

      const $ = (id) => document.getElementById(id);
      let editing = null;

      async function load() {
        const zone = $('zone');
        zone.innerHTML = '<div class="empty">Loading…</div>';
        try {
          const res = await api.notifications();
          $('count').textContent = res.notifications.length + ' total';
          if (!res.notifications.length) {
            zone.innerHTML = '<div class="empty"><div class="big">&#128276;</div>No notifications yet.</div>';
            return;
          }
          zone.innerHTML = `<table>
            <thead><tr><th>Title</th><th>Description</th><th>Date</th><th style="width:180px">Actions</th></tr></thead>
            <tbody>${res.notifications.map((n) => `
              <tr>
                <td class="title-cell"><b>${escapeHtml(n.maintitle)}</b></td>
                <td>${escapeHtml(n.secondtitle) || '<span class="muted">—</span>'}</td>
                <td>${escapeHtml(fmtDate(n.publishdate))}</td>
                <td style="white-space:nowrap">
                  <button class="btn ghost sm" data-edit="${n.id}">Edit</button>
                  <button class="btn danger sm" data-del="${n.id}">Delete</button>
                </td>
              </tr>`).join('')}</tbody></table>`;

          zone.querySelectorAll('[data-edit]').forEach((b) => {
            b.onclick = () => openModal(res.notifications.find((x) => String(x.id) === b.dataset.edit));
          });
          zone.querySelectorAll('[data-del]').forEach((b) => {
            b.onclick = async () => {
              const n = res.notifications.find((x) => String(x.id) === b.dataset.del);
              if (!(await confirmDialog('Delete notification?', `"${n.maintitle}" will be removed.`))) return;
              try { await api.deleteNotification(n.id); toast('Notification deleted', 'ok'); load(); }
              catch (err) { toast(err.message, 'err'); }
            };
          });
        } catch (err) {
          zone.innerHTML = '<div class="empty">Could not load notifications.</div>';
          toast(err.message, 'err');
        }
      }

      function updatePreview() {
        $('pushPreview').textContent = JSON.stringify({
          title: $('n_main').value || 'Title',
          message: $('n_sub').value || 'Message',
          image: '',
          action_destination: 'govtjob',
          notificationid: editing ? String(editing.id) : '0',
        }, null, 2);
      }

      function openModal(item) {
        editing = item || null;
        $('modalTitle').textContent = item ? 'Edit notification' : 'New notification';
        $('n_main').value = item ? item.maintitle : '';
        $('n_sub').value = item ? item.secondtitle : '';
        $('n_date').value = item ? item.publishdate : new Date().toISOString().slice(0, 10);
        updatePreview();
        $('modal').classList.add('open');
        $('n_main').focus();
      }
      function closeModal() { $('modal').classList.remove('open'); editing = null; }

      ['n_main', 'n_sub'].forEach((id) => { $(id).oninput = updatePreview; });
      $('copyBtn').onclick = async () => {
        try {
          await navigator.clipboard.writeText($('pushPreview').textContent);
          toast('Payload copied', 'ok');
        } catch (e) { toast('Copy failed — select the text manually', 'err'); }
      };

      document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = closeModal; });
      $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
      $('addBtn').onclick = () => openModal(null);

      $('saveBtn').onclick = async () => {
        const main = $('n_main').value.trim();
        if (!main) { toast('Main title is required', 'err'); return; }
        try {
          await api.saveNotification({
            action: editing ? 'update' : 'create',
            id: editing ? editing.id : undefined,
            maintitle: main,
            secondtitle: $('n_sub').value.trim(),
            publishdate: $('n_date').value,
          });
          toast(editing ? 'Notification updated' : 'Notification created', 'ok');
          closeModal();
          load();
        } catch (err) { toast(err.message, 'err'); }
      };

      load();
    })();
  </script>
</body>
</html>
