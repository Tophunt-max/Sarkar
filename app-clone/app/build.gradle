plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gsbussiness.sarkariexamupdates'
    compileSdk 34

    defaultConfig {
        applicationId "com.gsbussiness.sarkariexamupdates"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Base URL of the REST backend (see /backend). Override per build with
        //   ./gradlew assembleDebug -PapiBase=https://your-domain.com/sarkar/api/
        def apiBase = project.findProperty("apiBase") ?: "http://10.0.2.2:8000/api/"
        buildConfigField "String", "API_BASE", "\"${apiBase}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.1'
    testImplementation 'junit:junit:4.13.2'
}
