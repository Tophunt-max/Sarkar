plugins {
    id 'com.android.application'
}

// Push notifications are optional. Drop your Firebase project's google-services.json
// into app/ to enable them; without it the app builds and runs with push disabled.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.rozgarone'
    compileSdk 34

    defaultConfig {
        applicationId "com.rozgarone"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Backend root (the folder that contains api/). Endpoints are appended as
        // "api/<name>.php", exactly like the original app's baseurl + endpoint.
        // Override per build with
        //   ./gradlew assembleDebug -PapiBase=https://your-domain.com/sarkar/
        def apiBase = project.findProperty("apiBase") ?: "http://10.0.2.2:8000/"
        buildConfigField "String", "API_BASE", "\"${apiBase}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    // Screen-size scaled dimens (@dimen/_15sdp …), the same library the original uses.
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.4'
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.1'
    testImplementation 'junit:junit:4.13.2'
}
